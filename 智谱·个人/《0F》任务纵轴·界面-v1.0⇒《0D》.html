.b-st-完成{color:#5f6368;background:#f1f3f4}
.cell{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cur);
      border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cell h3{font-size:13px;color:var(--cur);margin-bottom:6px}
.cell p{font-size:14px;line-height:1.75}
.cell .src{font-size:12px;color:var(--sub);margin-top:8px}
.law{font-size:11px;color:var(--sub);text-align:center;padding:0 0 8px;line-height:1.6}
footer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
       padding:8px 14px;display:flex;align-items:center;gap:10px;justify-content:center}
button{font-size:14px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);
       background:#fff;color:var(--ink);cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
.pgno{font-size:13px;color:var(--sub);min-width:110px;text-align:center}

<script>
const L=JSON.parse(document.getElementById('ldg').textContent);
const AX=L.横轴, CELLS=L.纵轴;
const byNo=Object.fromEntries(CELLS.map(c=>[c.格号,c]));
let order=[],pos=0,fU='全部',fS='全部';
const stCls=s=>s.startsWith('已对接')?'b-st-已对接':s.startsWith('候选格')?'b-st-候选格':s.startsWith('完成')?'b-st-完成':'b-st-待派';
const stKey=s=>s.startsWith('已对接')?'已对接':s.startsWith('候选格')?'候选格':s.startsWith('完成')?'完成':'待派';
function rebuild(){
  order=AX.map((a,i)=>i).filter(i=>(fU==='全部'||AX[i].需求单位===fU)&&(fS==='全部'||stKey(AX[i].状态)===fS));
  pos=0;render();
}
function render(){
  const axis=document.getElementById('axis');axis.innerHTML='';
  order.forEach((oi,k)=>{
    const a=AX[oi],b=document.createElement('div');
    b.className='chip'+(k===pos?' on':'');
    b.innerHTML='<em>'+a.格号+'</em>'+esc(a.页题);
    b.onclick=()=>{pos=k;render();};
    axis.appendChild(b);
    if(k===pos)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  });
  const pg=document.getElementById('pg');
  if(!order.length){pg.innerHTML='<div class="pghead"><h2>无匹配格</h2><div class="meta">放宽筛选条件</div></div>';}
  else{
    const oi=order[pos],a=AX[oi],c=byNo[a.格号];
    pg.innerHTML='<div class="pghead"><div class="meta"><span class="badge">格'+a.格号+'</span>'+
      '<span class="badge '+stCls(a.状态)+'">'+esc(a.状态)+'</span>'+
      '<span class="badge">需求单位：'+esc(a.需求单位)+'</span></div>'+
      '<h2>'+esc(a.页题)+'</h2>'+
      '<div class="meta"><span>⇒出处：'+esc(c['⇒出处'])+'</span></div></div>'+
      '<div class="cell"><h3>［内容格·纵轴］</h3><p>'+esc(c.内容)+'</p>'+
      (c.对接&&c.对接.length?'<div class="src">对接：'+c.对接.map(d=>esc(d.单位+' '+d.日期+' '+d.记)).join('；')+'</div>':'')+
      '</div>';
  }
  document.getElementById('pgno').textContent=order.length?('格 '+(pos+1)+' / '+order.length):'—';
  document.getElementById('prev').disabled=pos<=0;
  document.getElementById('next').disabled=pos>=order.length-1;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('prev').onclick=()=>{if(pos>0){pos--;render();}};
document.getElementById('next').onclick=()=>{if(pos<order.length-1){pos++;render();}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'&&pos>0){pos--;render();}
  if(e.key==='ArrowRight'&&pos<order.length-1){pos++;render();}});
const fUel=document.getElementById('fU');
L.单位表.map(u=>u.单位).forEach(u=>{const o=document.createElement('option');o.textContent='单位：'+u;fUel.appendChild(o);});
fUel.onchange=()=>{fU=fUel.value.replace('单位：','')||'全部';if(fU==='单位：全部')fU='全部';rebuild();};
document.getElementById('fS').onchange=e=>{fS=e.target.value==='状态：全部'?'全部':e.target.value;rebuild();};
/* 统计 */
const cnt={};AX.forEach(a=>{const k=stKey(a.状态);cnt[k]=(cnt[k]||0)+1;});
document.getElementById('stat').textContent='共'+AX.length+'格：'+
 ['待派','候选格','已对接','完成'].filter(k=>cnt[k]).map(k=>k+cnt[k]+'').join('｜');
rebuild();
